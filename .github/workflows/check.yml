name: check

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check skill invariants
        run: scripts/check-skills.sh
      - name: Validate plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
      - name: Test workspace_state.py
        run: python -m unittest discover -s tests -v
